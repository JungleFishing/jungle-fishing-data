name: Update river levels

on:
  schedule:
    - cron: "17 11 * * *"   # every day, 7:17 AM Manaus time
  workflow_dispatch:         # "Run workflow" button for manual runs
    inputs:
      debug:
        description: "Print a sample row from ANA"
        type: boolean
        default: true
  push:                      # re-run whenever the script itself changes
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**", "tracker.js", "home.js"]

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull latest levels from ANA
        id: pull
        continue-on-error: true
        env:
          ANA_IDENTIFICADOR: ${{ secrets.ANA_IDENTIFICADOR }}
          ANA_SENHA: ${{ secrets.ANA_SENHA }}
          JF_DEBUG: ${{ (github.event_name == 'push' || inputs.debug) && '1' || '0' }}
        run: |
          set -o pipefail
          { echo "run: $(date -u +%Y-%m-%dT%H:%MZ) ($GITHUB_EVENT_NAME)"; python -u scripts/update.py; } 2>&1 | tee run-log.txt
      - name: Save data.json and run log
        if: always()
        run: |
          git config user.name "jf-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json run-log.txt
          git diff --cached --quiet || git commit -m "River levels $(date -u +%Y-%m-%d)"
          git push
          for f in tracker.js home.js; do curl -s -m 30 https://purge.jsdelivr.net/gh/JungleFishing/jungle-fishing-data@main/$f >/dev/null || true; done
      - name: Report failure
        if: steps.pull.outcome == 'failure'
        run: exit 1
