name: Update river levels

on:
  schedule:
    - cron: "17 11 * * *"   # every day, 7:17 AM Manaus time
  workflow_dispatch:         # "Run workflow" button for manual runs
    inputs:
      debug:
        description: "Print a sample row from ANA"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull latest levels from ANA
        env:
          ANA_IDENTIFICADOR: ${{ secrets.ANA_IDENTIFICADOR }}
          ANA_SENHA: ${{ secrets.ANA_SENHA }}
          JF_DEBUG: ${{ inputs.debug && '1' || '0' }}
        run: python scripts/update.py
      - name: Save data.json
        run: |
          git config user.name "jf-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "River levels $(date -u +%Y-%m-%d)"
          git push
